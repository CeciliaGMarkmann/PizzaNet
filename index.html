<!DOCTYPE html>
<html lang="ptbr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzaria Online - UML em código</title>
</head>
<body>
    <header>
        <h1> Pizzaria Online</h1>
        <p>Modelo de dominio (UML) virando programa: monte um pedido e veja os objetos mudando em tempo real</p>
    </header>
    <main>
        <section:>
            <h2>Cardápio</h2>
            <div id="menu"></div>
        </section:>
        <section>
            <h2>Pedido</h2>
        </section>
        <section>
        <label>Cliente <input id="nome" placeholder="Nome"></label>
        <label>Endereço de entrega <input id="rua" placeholder="Rua e número"></label>
        <label>Cidade <input id="Cidade" placeholder="Cidade"></label>
        <h3>Itens</h3>
        <div id="Itens" class="mut"> Nenhum item ainda.</div>
        <div class="tot"><span>Total</span><span id="total">R$ 0,00</span></div>
        <label>Pagamento
            <select id="forma"><option>Pix</option><option>Cartãp</option><option>Dinheiro</option></select>
        </label>
        <button id="fim" style=""></button>
        </section>
    </main>
    
</body>
</html>
